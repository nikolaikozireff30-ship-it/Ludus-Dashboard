<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUDUS · Панель руководителя</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#000000; --surface:#141218; --surface2:#1A1722;
  --accent:#E31E24; --accent-dim:#9c1b1f;
  --text:#FFFFFF; --muted:#9A9AA5;
  --green:#5FCF8E; --amber:#E3B341; --red:#E06A6A;
  --head:'Oswald','Bebas Neue','Arial Narrow',sans-serif;
  --body:'Inter','Segoe UI',Arial,sans-serif;
  --radius:16px; --border:1px solid rgba(227,30,36,.22);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
header{position:relative;display:flex;align-items:center;gap:18px;padding:22px 30px;border-bottom:var(--border)}
.logo{font-family:var(--head);font-weight:700;font-size:30px;letter-spacing:2px;text-transform:uppercase}
.logo b{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;letter-spacing:.5px}
.calbtn{margin-left:auto;font-family:var(--head);text-transform:uppercase;letter-spacing:1px;
  background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:14px;white-space:nowrap}
.calpanel{position:absolute;right:30px;top:72px;z-index:50;background:var(--surface2);
  border:var(--border);border-radius:14px;padding:16px;width:300px;box-shadow:0 12px 34px rgba(0,0,0,.55);touch-action:manipulation}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  font-family:var(--head);text-transform:uppercase;letter-spacing:1px;font-size:14px}
.calhead button{background:var(--surface);color:var(--text);border:var(--border);border-radius:8px;cursor:pointer;padding:4px 12px;font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.caldow{color:var(--muted);font-size:10px;text-align:center;text-transform:uppercase}
.calday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;color:#0c0a12;font-weight:700}
.calday.has{cursor:pointer} .calday.has:hover{outline:2px solid #fff}
.calday.empty{background:transparent}
.calday.nodata{background:#2a2730;color:var(--muted);opacity:.5;cursor:default}
.calday.sel{outline:2px solid #fff}
.callegend{margin-top:10px;color:var(--muted);font-size:10px;display:flex;gap:8px;flex-wrap:wrap}
.callegend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:3px}
.calmodes{display:flex;gap:6px;margin-bottom:10px}
.calmodes button{flex:1;background:var(--surface);color:var(--muted);border:var(--border);border-radius:8px;padding:9px 6px;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.5px;touch-action:manipulation}
.calmodes button.on{background:var(--accent);color:#fff;font-weight:700}
.cmpchips{margin-bottom:8px;font-size:11px;color:var(--muted);line-height:1.5}
.cmpstatus{background:rgba(227,30,36,.16);border:1px solid var(--accent);border-radius:8px;
  padding:9px 11px;margin-bottom:10px;font-size:12px;color:var(--text);line-height:1.4;font-weight:600}
.cmpstatus a{color:var(--accent);margin-left:8px;font-weight:600}
.calday.selA{outline:2px solid #fff} .calday.selB{outline:2px solid var(--green)}
.up{color:var(--green);font-weight:600} .down{color:var(--red);font-weight:600}
nav{display:flex;gap:8px;padding:16px 30px 0;flex-wrap:wrap}
nav button{font-family:var(--head);text-transform:uppercase;letter-spacing:1px;font-size:15px;
  background:var(--surface);color:var(--muted);border:var(--border);border-radius:10px;padding:9px 18px;cursor:pointer;transition:.15s}
nav button:hover{color:var(--text)}
nav button.active{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}
main{padding:24px 30px 60px}
.tab{display:none} .tab.active{display:block}
h2{font-family:var(--head);text-transform:uppercase;letter-spacing:1.5px;font-size:22px;margin:6px 0 18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two-cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:var(--border);border-radius:var(--radius);padding:20px}
.card.bar{border-left:3px solid var(--accent)}
.kpi .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.kpi .val{font-family:var(--head);font-size:46px;color:#FFFFFF;line-height:1.1;margin-top:6px}
.kpi .note{color:var(--muted);font-size:12px;margin-top:4px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:560px;border-collapse:collapse}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
th{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:11px}
tr.click{cursor:pointer} tr.click:hover{background:var(--surface2)}
.pill{display:inline-block;min-width:42px;text-align:center;padding:3px 10px;border-radius:20px;font-weight:700;font-family:var(--head);font-size:15px;color:#0c0a12}
.rank{font-family:var(--head);font-size:18px;color:var(--accent);width:30px}
.muted{color:var(--muted)} .small{font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.radarbox{background:var(--surface);border:var(--border);border-radius:var(--radius);padding:16px}
.radarbox h3{font-family:var(--head);text-transform:uppercase;letter-spacing:1px;font-size:14px;color:var(--accent);margin:0 0 8px}
.radarwrap{position:relative;height:280px}
.hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.detail{background:var(--surface2);border-left:2px solid var(--accent);border-radius:8px;padding:14px 16px;margin:2px 0 6px;white-space:pre-wrap;font-size:13px;line-height:1.5}
.typegrid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.type .n{font-family:var(--head);font-size:40px;color:var(--accent)}
.type .t{text-transform:uppercase;letter-spacing:1px;font-size:12px;color:var(--muted)}
.ai{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ai .card{min-height:120px}
.ai h3{font-family:var(--head);text-transform:uppercase;letter-spacing:1px;font-size:16px;margin:0 0 10px}
.mgrcards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:18px}
.mgrcard .nm{font-family:var(--head);font-size:18px;text-transform:uppercase;letter-spacing:1px}
.tag{display:inline-block;background:var(--surface2);border:1px solid rgba(227,30,36,.25);color:var(--accent);border-radius:6px;padding:2px 7px;font-size:11px;margin:3px 3px 0 0}
.flag{display:inline-block;background:rgba(227,179,65,.12);border:1px solid rgba(227,179,65,.4);color:var(--amber);border-radius:6px;padding:2px 7px;font-size:11px;margin:4px 4px 0 0;cursor:help}
.legend{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}
.legend b{color:var(--amber)}
.cmpselect{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cmpselect label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cmpselect select{background:var(--surface);color:var(--text);border:var(--border);border-radius:10px;padding:10px 12px;font-size:15px;font-family:var(--body);min-width:170px}
@media(max-width:600px){
  header{padding:16px 16px;flex-wrap:wrap;gap:6px}
  .logo{font-size:24px}
  .sub{font-size:12px}
  .calbtn{font-size:12px;padding:7px 10px}
  .calpanel{right:14px;left:14px;top:auto;width:auto}
  nav{padding:12px 14px 0}
  nav button{font-size:13px;padding:7px 12px}
  main{padding:16px 14px 44px}
  h2{font-size:19px}
  .card{padding:16px}
  .kpi .val{font-size:34px}
  .kpis,.two-cards,.typegrid,.ai,.mgrcards{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .radarwrap{height:260px}
}
@media(max-width:430px){
  .kpis,.two-cards,.typegrid,.ai,.mgrcards{grid-template-columns:1fr}
}
</style>
</head>

  <div class="logo">LUD<b>US</b></div>

09-18 20:37] Клиент: Thank you\n- [2026-09-19 14:12] Maiya Suwannakan: Hello! Could I ask how your private Muay Thai session was?\n- [2026-09-19 17:46] Клиент: Hello\n- [2026-09-19 17:47] Клиент: The class was very good I like Kru Krit style of training.\n- [2026-09-19 17:50] Maiya Suwannakan: I am delighted to hear that you enjoyed your class. Could I ask if you would like to book you next session in advance?\n- [2026-09-19 17:51] Клиент: Every Saturday same time is good for me 9am\n- [2026-09-19 17:51] Клиент: Next Saturday ( my BD 😁😊)\n- [2026-09-19 18:04] Maiya Suwannakan: Would it be possible to do 9:30 instead? 😊 There is still a group class running at 9:00, and we’ve recently introduced a new rule that PT sessions can’t take place while group classes are in progress, so we just want to make sure you have a comfortable and uninterrupted session. ⏎  ⏎ We hope 9:30 works for you! And happy birthday in advance! 🎂🥳 We hope you have a wonderful birthday and a great workout with us! 💪😊\n- [2026-10-06 13:13] Maiya Suwannakan: Hello! 😊 Just a little reminder that you have 2 Muay Thai sessions remaining. You can make the payment at the reception, just like last time. 🙏"}, {"чат": "L61387192", "менеджер": "Ekaterina", "канал": "IG", "тип": "новый", "тип_комментарий": "новый (пост-визит, воронка «VISIT completed», клиент пишет первым; три вложения без ответа)", "флаги": ["БРОШЕН"], "баллы": {"скорость": null, "приветствие": 1, "выявление": 1, "презентация": 1, "возражения": null, "следующий шаг": 1, "фоллоу-ап": 1, "тон": 1, "сервис": null}, "бонус": 0.0, "итог": 1.0, "кап": "капнут до 6: следующий шаг ≤3, фоллоу-ап ≤3", "главная_ошибка": "Тёплый клиент после состоявшегося визита (помечен «potential 1 year», супруги, интерес к борьбе) трижды прислал сообщения в течение трёх дней и остался без ответа — вероятная потеря годового контракта.", "совет": "Сегодня же ответить голосом/текстом: «Добрый день! Рада, что вы снова на связи — как нога? Увидела ваши сообщения: <ответ п ur Instagram account to view it.\n- [2026-10-06 19:42] Клиент: [вложение]"}, {"чат": "L63436980", "менеджер": "Venika", "канал": "IG", "тип": "новый", "тип_комментарий": "новый (тёплый фоллоу-ап по Open Days; в день оценки менеджер написал первым)", "флаги": ["МНОГОДНЕВНЫЙ"], "баллы": {"скорость": null, "приветствие": null, "выявление": 2, "презентация": 2, "возражения": null, "следующий шаг": 1, "фоллоу-ап": 3, "тон": 6}, "бонус": 0.0, "итог": 2.3, "кап": "капнут до 6: следующий шаг ≤3, фоллоу-ап ≤3", "главная_ошибка": "Клиентка ответила на пинг («I didn't visit your classes on Open day»), а менеджер не продолжил диалог, оставив горячий отклик без реакции и без нового повода.", "совет": "На «I didn't visit» ответить в течение часа с новым поводом, например: «No worries, Nadya! Reformer Pilates still has spots this Tuesday and Thursday 9:00. Would Thursday work for a trial for you and your friend?», вместо повторного вопроса «были ли вы».", "текст": "- [2026-09-22 13:44] Клиент: Hello! Can I make an appointment for open day please ? ⏎ Pilates mat on Saturday 2 people\n- [2026-09-22 13:53] Venika: Hello! Thank you for you interested in Ludus Open Days. Unfortunately, Pilate Mat is now fully booked. Would you have a chance to join other class instead for example Yoga? 😊\n- [2026-09-22 13:54] Клиент: At the same time?\n- [2026-09-22 14:00] Venika: For Yoga will be at 7:30 - 08:30 25th. You still can choose any classes that suitable with you convenient time. You can kindly check all the schedule through Ludus Complex Open Days post and here is the link for you ⏎  ⏎ https://www.instagram.com/p/DdRn6VSjzLo/?stkn=dmNhdzdzMmt3dXVk ⏎  ⏎ If you have any question or any more information you would like to know more, please feel free to let me know\n- [2026-09-22 14:01] Клиент: What about price for reformer Pilates on Friday?\n- [2026-09-22 14:04] Venika: For Friday Pilates Class is now already fully booked 🙏 In this week you still can join Pilates Reformer on Tuesday and Thursd а): We will contact you shortly and answer all your questions.\n- [2026-10-07 08:38] Maiya Suwannakan: Thank you for your interest in our Cycling class! 😊 We have classes every Monday–Friday at 19:00, and a single session is 450 baht. ⏎  ⏎ We also have session packages and monthly options available. Would you be interested in hearing more about the different packages? 🚴‍♀️"}]};                 // {сводка, чаты} за сегодня (вшито)
const СЕГОДНЯ = (INLINE.сводка && INLINE.сводка.дата) || "";

const NAMES = {
  "скорость":"Скорость ответа","приветствие":"Приветствие","выявление":"Выявление потребности",
  "презентация":"Презентация клуба","возражения":"Работа с возражениями","следующий шаг":"Приглашение на визит",
  "фоллоу-ап":"Возврат к клиенту","тон":"Тон общения","сервис":"Решение вопроса клиента",
  "скорость касания":"Скорость первого ответа","качество касания":"Качество первого сообщения",
  "имя":"Уточнение имени","мягкий вход":"Ненавязчивость","снятие настороженности":"Снятие недоверия",
  "cta":"Приглашение","каденция":"Повторные касания","маршрутизация":"Передача нужному человеку",
  "вежливость":"Вежливость"
};
const FLAGS = {
  "БРОШЕН":["Брошен","клиент остался без ответа / менеджер прервал диалог"],
  "КОРОТКИЙ":["Короткий","очень короткий диалог (2–3 реплики)"],
  "МНОГОДНЕВНЫЙ":["Многодневный","переписка тянулась несколько дней"]
};
const ВХОД_ОРД = ["скорость","приветствие","выявление","презентация","возражения","следующий шаг","фоллоу-ап","тон","сервис"];
const ИСХ_ОРД = ["качество касания","имя","мягкий вход","выявление","презентация","снятие настороженности","cta","каденция","тон"];

function nm(k){ return NAMES[k]||k; }
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function flagHtml(f){ const x=FLAGS[f]||[f,""]; return `<span class="flag" title="${esc(x[1])}">${esc(x[0])}</span>`; }
function colorFor(v){ if(v==null) return "var(--muted)"; if(v>=7) return "var(--green)"; if(v>=5) return "var(--amber)"; return "var(--red)"; }
function динHtml(m){ const d=m&&m.динамика_неделя;
  if(d==null) return '<span class="muted">—</span>';
  if(d>0) return `<span style="color:var(--green)">↑ +${d.toFixed(1)}</span>`;
  if(d<0) return `<span style="color:var(--red)">↓ −${Math.abs(d).toFixed(1)}</span>`;
  return '<span class="muted">→ 0.0</span>'; }

/* ===== Состояние: какой день показан ===== */
let СОСТ = {сводка: INLINE.сводка, чаты: INLINE.чаты, дата: СЕГОДНЯ};
let активная = "обзор";

/* ===== Вкладки ===== */
const TABS=[["обзор","Обзор"],["рейтинг","Рейтинг"],["типы","По типам"],["чаты","Разбор чатов"],["панель","Панель руководителя"],["сравнение","Сравнение"]];
(function(){ const nav=document.getElementById("nav");
  TABS.forEach(([id,name],i)=>{ const b=document.createElement("button"); b.textContent=name; if(i===0)b.className="active";
    b.onclick=()=>{ document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); document.getElementById("tab-"+id).classList.add("active");
      активная=id; if(id==="рейтинг") ensureRadar(); };
    nav.appendChild(b); });
})();

/* ===== Рендер вкладок из СОСТ ===== */
function renderОбзор(){ const S=СОСТ.сводка,OTD=S.отдел,MGR=S.менеджеры;
  const луч=OTD.лучший_менеджер||["—","—"];
  const total=Object.values(MGR).reduce((a,m)=>a+(m.чатов?m.чатов.всего:0),0);
  const cards=[["Всего чатов",total,"за день"],["Средний балл отдела",OTD.средний_итог,"по продающим"],
    ["Успешных ≥7",OTD["успешных_≥7_pct"]+"%",OTD["успешных_≥7"].чатов+" из "+OTD["успешных_≥7"].из],
    ["Лучший менеджер",луч[0],"итог "+луч[1]]];
  let h='<h2>Обзор дня</h2><div class="grid kpis">';
  cards.forEach(c=>h+=`<div class="card bar kpi"><div class="label">${c[0]}</div><div class="val">${esc(c[1])}</div><div class="note">${esc(c[2])}</div></div>`);
  h+='</div>';
  h+=`<div class="grid two-cards" style="margin-top:16px">
    <div class="card"><div class="label muted small">САМОЕ СЛАБОЕ · ВХОДЯЩИЕ</div>
      <div style="font-family:var(--head);font-size:28px;color:var(--accent);margin-top:6px">${esc(nm(OTD.слабейший_входящий[0]))} · ${OTD.слабейший_входящий[1]}</div></div>
    <div class="card"><div class="label muted small">САМОЕ СЛАБОЕ · ИСХОДЯЩИЕ</div>
      <div style="font-family:var(--head);font-size:28px;color:var(--accent);margin-top:6px">${esc(nm(OTD.слабейший_исходящий[0]))} · ${OTD.слабейший_исходящий[1]}</div></div></div>
  <div class="card" style="margin-top:16px"><div class="label muted small">ВОЗРАЖЕНИЯ · ПАРТНЁРСТВО</div>
   <div style="margin-top:8px">Входящих с возражением: <b>${OTD.возражения["входящих_с_возражением"]}</b>, средняя отработка <b style="color:var(--amber)">${OTD.возражения["средняя_отработка"]}</b> &nbsp;·&nbsp;
   Партнёрских обращений: <b>${OTD.партнёрство.обращений}</b> — передано нужному человеку ${OTD.партнёрство["передано_корректно"]}, требуют внимания ${OTD.партнёрство["требуют_внимания"]}</div></div>`;
  document.getElementById("tab-обзор").innerHTML=h;
}
function renderРейтинг(){ const OTD=СОСТ.сводка.отдел,MGR=СОСТ.сводка.менеджеры;
  let h='<h2>Рейтинг менеджеров</h2><p class="hint">Клик по менеджеру — профиль по критериям (входящие / исходящие). Динамика — изменение рейтинга к прошлой неделе.</p>';
  h+='<div class="card"><div class="scroll"><table><thead><tr><th>#</th><th>Менеджер</th><th>Итог</th><th>Входящие / Исходящие / Партнёрство</th><th>Динамика</th></tr></thead><tbody>';
  OTD.рейтинг.forEach(([nmv,b],i)=>{ const ch=MGR[nmv].чатов;
    h+=`<tr class="click" onclick="showRadar('${nmv}')"><td class="rank">${i+1}</td><td><b>${nmv}</b></td>
      <td><span class="pill" style="background:${colorFor(b)}">${b}</span></td>
      <td class="muted">${ch.входящие} / ${ch.исходящие} / ${ch.партнёрство}</td><td>${динHtml(MGR[nmv])}</td></tr>`; });
  h+='</tbody></table></div></div><div id="radararea" style="margin-top:18px"></div>';
  document.getElementById("tab-рейтинг").innerHTML=h;
  RADAR_INIT=false;
}
function renderТипы(){ const CH=СОСТ.чаты, типы={};
  CH.forEach(c=>{ (типы[c.тип]=типы[c.тип]||[]).push(c.итог); });
  const поряд=["новый","продление","сервис","исходящий","партнёрство"];
  let h='<h2>По типам чатов</h2><div class="grid typegrid">';
  поряд.forEach(t=>{ const a=типы[t]||[]; const avg=a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):"—";
    h+=`<div class="card type"><div class="n">${a.length}</div><div class="t">${t}</div>
      <div style="margin-top:8px">ср. итог <b style="color:${colorFor(a.length?+avg:null)}">${avg}</b></div></div>`; });
  h+='</div>'; document.getElementById("tab-типы").innerHTML=h;
}
function renderЧаты(){ const CH=СОСТ.чаты;
  let h='<h2>Разбор по каждому чату</h2><p class="hint">Клик по строке — раскрыть текст чата.</p>';
  h+='<div class="card"><div class="scroll"><table><thead><tr><th>ID</th><th>Менеджер</th><th>Тип</th><th>Итог</th><th>Главная ошибка</th></tr></thead><tbody>';
  CH.forEach((c,i)=>{
    h+=`<tr class="click" onclick="toggle(${i})"><td><b>${esc(c.чат)}</b></td><td>${esc(c.менеджер)}</td>
      <td class="muted">${esc(c.тип)}</td><td><span class="pill" style="background:${colorFor(c.итог)}">${c.итог}</span></td>
      <td class="small">${esc(c.главная_ошибка)}</td></tr>
      <tr id="d${i}" style="display:none"><td colspan="5"><div class="detail"><b>Текст чата:</b>\n${esc(c.текст)}\n\n<b>Совет:</b> ${esc(c.совет)}${c.кап?"\n<b>Ограничение балла:</b> "+esc(c.кап):""}</div></td></tr>`; });
  h+='</tbody></table></div></div>'; document.getElementById("tab-чаты").innerHTML=h;
}
function renderПанель(){ const OTD=СОСТ.сводка.отдел,MGR=СОСТ.сводка.менеджеры;
  const главное=`Слабее всего отдел держит ВОЗВРАТЫ: «${nm(OTD.слабейший_входящий[0])}» во входящих — ${OTD.слабейший_входящий[1]}, «${nm(OTD.слабейший_исходящий[0])}» в исходящих — ${OTD.слабейший_исходящий[1]}.`;
  const внимание=`Работа с возражениями — ${OTD.возражения["средняя_отработка"]}/10 (${OTD.возражения["входящих_с_возражением"]} чатов). Партнёрство: ${OTD.партнёрство["требуют_внимания"]} из ${OTD.партнёрство.обращений} обращений не переданы нужному человеку.`;
  const хорошо=`Лидер дня — ${OTD.лучший_менеджер[0]} (${OTD.лучший_менеджер[1]}). Отдел силён в скорости ответа и тоне общения.`;
  let h='<h2>Панель руководителя</h2><div class="grid ai">';
  h+=`<div class="card" style="border-left:3px solid var(--red)"><h3>🔴 Главная проблема</h3><div class="small">${esc(главное)}</div></div>`;
  h+=`<div class="card" style="border-left:3px solid var(--amber)"><h3>🟠 Зона внимания</h3><div class="small">${esc(внимание)}</div></div>`;
  h+=`<div class="card" style="border-left:3px solid var(--green)"><h3>✅ Что хорошо</h3><div class="small">${esc(хорошо)}</div></div></div><div class="grid mgrcards">`;
  OTD.рейтинг.forEach(([nmv,b])=>{ const m=MGR[nmv]; const слаб=[...(m.слабые_входящие||[]),...(m.слабые_исходящие||[])];
    h+=`<div class="card mgrcard"><div class="nm">${nmv}</div>
      <div><span class="pill" style="background:${colorFor(b)};margin:6px 0">${b}</span></div>
      <div class="small muted">слабые места: ${слаб.length?[...new Set(слаб)].map(s=>`<span class="tag">${esc(nm(s))}</span>`).join(""):"—"}</div>
      <div>${(m.флаги||[]).map(flagHtml).join("")}</div></div>`; });
  h+='</div><div class="legend"><b>Флаги:</b> Брошен — клиент без ответа · Короткий — 2–3 реплики · Многодневный — несколько дней.</div>';
  document.getElementById("tab-панель").innerHTML=h;
}
function renderAll(){ renderОбзор(); renderРейтинг(); renderТипы(); renderЧаты(); renderПанель();
  document.getElementById("caldate").textContent = СОСТ.дата || "—";
  if(активная==="рейтинг") ensureRadar();
}
function toggle(i){ const r=document.getElementById("d"+i); r.style.display = r.style.display==="none"?"table-row":"none"; }

/* ===== Радар ===== */
let RADAR_INIT=false, charts={};
function ensureRadar(){ if(!RADAR_INIT){ RADAR_INIT=true; showRadar(СОСТ.сводка.отдел.рейтинг[0][0]); } }
function radarData(prof,ord){ const labels=ord.filter(k=>k in prof); return {labels:labels.map(nm), values:labels.map(k=>prof[k])}; }
function makeRadar(canvasId,title,prof,ord){
  const {labels,values}=radarData(prof,ord); const ctx=document.getElementById(canvasId);
  if(charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId]=new Chart(ctx,{type:'radar',data:{labels,datasets:[{label:title,data:values,fill:true,
    backgroundColor:'rgba(227,30,36,.25)',borderColor:'#E31E24',pointBackgroundColor:'#E31E24',borderWidth:2,pointRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{r:{min:0,max:10,ticks:{stepSize:2,color:'#9A9AA5',backdropColor:'transparent',font:{size:9}},
        grid:{color:'rgba(255,255,255,.12)'},angleLines:{color:'rgba(255,255,255,.12)'},pointLabels:{color:'#FFF',font:{size:9}}}},
      plugins:{legend:{display:false}}}});
}
function showRadar(nmv){ const m=СОСТ.сводка.менеджеры[nmv];
  const пустоИсх=Object.values(m.профиль_исходящих).every(v=>v==null);
  document.getElementById("radararea").innerHTML=`<div class="two">
    <div class="radarbox"><h3>${nmv} · входящие</h3><div class="radarwrap"><canvas id="rin"></canvas></div></div>
    <div class="radarbox"><h3>${nmv} · исходящие</h3>${пустоИсх?'<div class="radarwrap"><p class="hint">нет исходящих чатов</p></div>':'<div class="radarwrap"><canvas id="rout"></canvas></div>'}</div></div>`;
  makeRadar("rin",nmv,m.профиль_входящих,ВХОД_ОРД);
  if(!пустоИсх) makeRadar("rout",nmv,m.профиль_исходящих,ИСХ_ОРД);
}

/* ===== Календарь + теплокарта ===== */
const МЕС=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const ДНИ=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
let ИНДЕКС={}, калГод, калМес, калОткрыт=false;
function ymd(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function открытьКалендарь(){ калОткрыт=!калОткрыт;
  document.getElementById("calpanel").style.display=калОткрыт?"block":"none"; if(калОткрыт) renderКалендарь(); }
function смкМес(д){ калМес+=д; if(калМес<0){калМес=11;калГод--;} if(калМес>11){калМес=0;калГод++;} renderКалендарь(); }

/* ===== Верхний календарь — ТОЛЬКО просмотр одного дня ===== */
function renderКалендарь(){
  const p=document.getElementById("calpanel");
  const старт=(new Date(калГод,калМес,1).getDay()+6)%7;       // Пн=0
  const дней=new Date(калГод,калМес+1,0).getDate();
  let h=`<div class="calhead"><button data-mv="-1">‹</button><span>${МЕС[калМес]} ${калГод}</span><button data-mv="1">›</button></div><div class="calgrid">`;
  ДНИ.forEach(d=>h+=`<div class="caldow">${d}</div>`);
  for(let i=0;i<старт;i++) h+='<div class="calday empty"></div>';
  for(let d=1;d<=дней;d++){ const ds=ymd(калГод,калМес,d); const v=ИНДЕКС[ds];
    let cls="calday", style="", attr="";
    if(v==null){ cls+=" nodata"; }
    else { cls+=" has"; const c=v>=7?"var(--green)":(v>=5?"var(--amber)":"var(--red)"); style=`background:${c}`; attr=`data-d="${ds}"`; }
    if(ds===СОСТ.дата) cls+=" sel";
    h+=`<div class="${cls}" style="${style}" ${attr} title="${ds}${v!=null?' · '+v:' · нет данных'}">${d}</div>`; }
  h+='</div><div class="callegend"><span><i style="background:var(--green)"></i>≥7</span><span><i style="background:var(--amber)"></i>5–7</span><span><i style="background:var(--red)"></i>&lt;5</span><span><i style="background:#2a2730"></i>нет данных</span></div>';
  p.innerHTML=h;
}
async function выбратьДень(дата){
  try{
    const s=await (await fetch(`данные/${дата}.json`)).json();
    let ч=[]; try{ ч=await (await fetch(`данные/${дата}_чаты.json`)).json(); }catch(e){}
    СОСТ={сводка:s, чаты:ч, дата:дата}; renderAll(); открытьКалендарь();
  }catch(e){ console.warn("нет данных за", дата, e); }
}

/* ===== Сравнение двух дат — нативные <select> во вкладке «Сравнение» ===== */
function дельтаHtml(a,b){
  if(a==null||b==null) return '<span class="muted">—</span>';
  const d=Math.round((b-a)*10)/10;
  if(d>0) return `<span class="up">↑ +${d.toFixed(1)}</span>`;
  if(d<0) return `<span class="down">↓ −${Math.abs(d).toFixed(1)}</span>`;
  return '<span class="muted">→ 0.0</span>';
}
function построитьСравнениеТаб(){
  const tab=document.getElementById("tab-сравнение");
  const даты=Object.keys(ИНДЕКС).sort();
  if(даты.length<2){
    tab.innerHTML='<h2>Сравнение двух дат</h2><p class="hint">Нужно минимум два дня с опубликованными данными (сейчас: '+даты.length+').</p>';
    return;
  }
  const opt=(sel)=>даты.map(d=>`<option value="${d}"${d===sel?' selected':''}>${d} · ${ИНДЕКС[d]}</option>`).join("");
  const A=даты[0], B=даты[даты.length-1];   // по умолчанию: самый ранний и самый поздний день
  tab.innerHTML=`<h2>Сравнение двух дат</h2>
    <div class="cmpselect">
      <label>Дата A<select id="selA">${opt(A)}</select></label>
      <label>Дата B<select id="selB">${opt(B)}</select></label>
    </div>
    <div id="cmpresult"></div>`;
  document.getElementById("selA").addEventListener("change", приСменеДат);
  document.getElementById("selB").addEventListener("change", приСменеДат);
  приСменеДат();   // показать сравнение для дефолтных A и B сразу
}
function приСменеДат(){
  const A=document.getElementById("selA").value, B=document.getElementById("selB").value;
  if(A && B) сравнить(A,B);
}
async function сравнить(A,B){
  const res=document.getElementById("cmpresult");
  try{
    const [sA,sB]=await Promise.all([
      fetch(`данные/${A}.json`).then(r=>r.json()),
      fetch(`данные/${B}.json`).then(r=>r.json())]);
    renderСравнение(A,sA,B,sB);
  }catch(e){ res.innerHTML='<p class="hint">Не удалось загрузить данные за выбранные даты.</p>'; }
}
function renderСравнение(A,sA,B,sB){
  const oA=sA.отдел,oB=sB.отдел,mA=sA.менеджеры,mB=sB.менеджеры;
  let h=`<p class="hint">Δ — изменение от <b>${A}</b> к <b>${B}</b>. Рост — <span class="up">зелёный</span>, падение — <span class="down">красный</span>.</p>`;
  h+=`<div class="card bar" style="margin-bottom:16px"><span class="label muted small">СРЕДНИЙ БАЛЛ ОТДЕЛА</span>
      <div style="margin-top:6px;font-size:18px">${oA.средний_итог} → <b>${oB.средний_итог}</b> &nbsp; ${дельтаHtml(oA.средний_итог,oB.средний_итог)}</div></div>`;
  h+=`<div class="card"><div class="scroll"><table><thead><tr><th>Менеджер</th><th>${A}</th><th>${B}</th><th>Δ</th></tr></thead><tbody>`;
  [...new Set([...Object.keys(mA),...Object.keys(mB)])].forEach(n=>{
    const a=mA[n]&&mA[n].рейтинговый_балл, b=mB[n]&&mB[n].рейтинговый_балл;
    h+=`<tr><td><b>${n}</b></td><td class="muted">${a==null?'—':a}</td><td>${b==null?'—':b}</td><td>${дельтаHtml(a,b)}</td></tr>`; });
  h+='</tbody></table></div></div>';
  function таблКрит(заг,поле,ord){
    const da=oA[поле]||{}, db=oB[поле]||{};
    const keys=ord.filter(k=>k in da||k in db);
    let t=`<h2 style="font-size:16px;margin-top:22px">${заг}</h2><div class="card"><div class="scroll"><table><thead><tr><th>Критерий</th><th>${A}</th><th>${B}</th><th>Δ</th></tr></thead><tbody>`;
    keys.forEach(k=>{ const a=da[k], b=db[k];
      t+=`<tr><td>${esc(nm(k))}</td><td class="muted">${a==null?'—':a}</td><td>${b==null?'—':b}</td><td>${дельтаHtml(a,b)}</td></tr>`; });
    return t+'</tbody></table></div></div>';
  }
  h+=таблКрит('Критерии отдела · входящие','средние_входящие',ВХОД_ОРД);
  h+=таблКрит('Критерии отдела · исходящие','средние_исходящие',ИСХ_ОРД);
  document.getElementById("cmpresult").innerHTML=h;
}
async function загрузитьИндекс(){
  try{ const arr=await (await fetch("данные/индекс.json")).json();
    ИНДЕКС={}; arr.forEach(x=>ИНДЕКС[x.дата]=x.средний_итог);
  }catch(e){ ИНДЕКС={}; if(СЕГОДНЯ) ИНДЕКС[СЕГОДНЯ]=СОСТ.сводка.отдел.средний_итог; } // автономно — только сегодня
  if(калОткрыт) renderКалендарь();
  построитьСравнениеТаб();
}

/* ===== Старт: сегодня inline (мгновенно), затем подгрузка индекса ===== */
калГод=+(СЕГОДНЯ.slice(0,4))||new Date().getFullYear();
калМес=(+(СЕГОДНЯ.slice(5,7))||1)-1;

/* Делегирование на постоянной панели календаря: только просмотр дня и переключение месяца. */
document.getElementById("calpanel").addEventListener("click", function(e){
  const день=e.target.closest("[data-d]"); if(день){ выбратьДень(день.getAttribute("data-d")); return; }
  const мес=e.target.closest("[data-mv]");  if(мес){ e.preventDefault(); смкМес(+мес.getAttribute("data-mv")); return; }
});

renderAll();
document.getElementById("tab-сравнение").innerHTML='<h2>Сравнение двух дат</h2><p class="hint">Загрузка доступных дат…</p>';
загрузитьИндекс();
</script>
</body>
</html>
