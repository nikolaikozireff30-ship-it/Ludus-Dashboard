header{position:relative;display:flex;align-items:center;gap:18px;padding:22px 30px;border-bottom:var(--border)}

.legend{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}
.legend b{color:var(--amber)}
.cmpselect{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}

.cmpselect select{background:var(--surface);color:var(--text);border:var(--border);border-radius:10px;padding:10px 12px;font-size:15px;font-family:var(--body);min-width:170px}

  .radarwrap{height:260px}

@media(max-width:430px){

/* ===== Вкладка «Месяц»: итоги отдела за календарный месяц из вшитых строк чатов ===== */
const ПРОДАЮЩИЕ=new Set(["новый","продление","сервис","исходящий"]);
const ВХОДЯЩИЕ=new Set(["новый","продление","сервис"]);
let МЕСЯЦ_INIT=false, МЕС_ВЫБРАН=null;
function ensureМесяц(){ if(!МЕСЯЦ_INIT){ МЕСЯЦ_INIT=true; МЕС_ВЫБРАН=СЕГОДНЯ.slice(0,7); renderМесяц(); } }
function avg(a){ const v=a.filter(x=>x!=null); return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length*10)/10:null; }
function статМесяца(ym){ const дни=ДАТЫ.filter(d=>d.startsWith(ym)); if(!дни.length) return null;
  const rows=[]; дни.forEach(d=>ИСТОРИЯ[d].чаты.forEach(c=>rows.push(Object.assign({дата:d},c))));
  const прод=rows.filter(c=>ПРОДАЮЩИЕ.has(c.тип));
  const mgr={};
  rows.forEach(c=>{ const имя=String(c.менеджер||"—").replace(/\s*\(с телефона\)\s*$/,""); const m=mgr[имя]=mgr[имя]||{всего:0,прод:[],дни:new Set()}; m.всего++; m.дни.add(c.дата); if(ПРОДАЮЩИЕ.has(c.тип)) m.прод.push(c.итог); });
  const рейтинг=Object.entries(mgr).map(([n,m])=>[n,avg(m.прод),m.всего,m.дни.size]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
  const крит=(набор,ord)=>{ const o={}; ord.forEach(k=>{ const v=avg(rows.filter(c=>набор.has(c.тип)).map(c=>c.баллы&&c.баллы[k])); if(v!=null)o[k]=v; }); return o; };
  const типы={}; rows.forEach(c=>{ (типы[c.тип]=типы[c.тип]||[]).push(c.итог); });
  const поДням=дни.map(d=>({дата:d, средний:ИСТОРИЯ[d].сводка.отдел.средний_итог, чатов:ИСТОРИЯ[d].чаты.length||Object.values(ИСТОРИЯ[d].сводка.менеджеры).reduce((a,m)=>a+(m.чатов?m.чатов.всего:0),0)}));
  const сДанными=поДням.filter(x=>x.средний!=null);
  return {ym, дни, чатов:rows.length, есть_строки:rows.length>0, средний:avg(прод.map(c=>c.итог)),
    успешных:прод.filter(c=>c.итог>=7).length, продающих:прод.length, рейтинг,
    вход:крит(ВХОДЯЩИЕ,ВХОД_ОРД), исх:крит(new Set(["исходящий"]),ИСХ_ОРД), типы, поДням,
    лучший:сДанными.length?sДанными(сДанными,1):null, худший:сДанными.length?sДанными(сДанными,-1):null};
}
function sДанными(a,sgn){ return a.reduce((b,x)=>(sgn*(x.средний-b.средний)>0?x:b)); }
function predYm(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`; }
function renderМесяц(){
  const tab=document.getElementById("tab-месяц");
  const месяцы=[...new Set(ДАТЫ.map(d=>d.slice(0,7)))].sort();
  const ym=МЕС_ВЫБРАН||месяцы[месяцы.length-1];
  const M=статМесяца(ym), P=статМесяца(predYm(ym));
  const sel=`<div class="cmpselect"><label>Месяц<select id="selM">${месяцы.map(m=>`<option value="${m}"${m===ym?' selected':''}>${МЕС[+m.slice(5,7)-1]} ${m.slice(0,4)}</option>`).join("")}</select></label></div>`;
  if(!M){ tab.innerHTML='<h2>Итоги месяца</h2>'+sel+'<p class="hint">Нет данных за этот месяц.</p>'; bindM(); return; }
  const рабочих=M.дни.length;
  let h='<h2>Итоги месяца · отдел продаж</h2>'+sel;
  if(!M.есть_строки){ h+=`<p class="hint">За ${ym} в дашборд вшиты только дневные сводки (разбор чатов хранится за текущий и прошлый месяц). Показатели ниже — по дневным сводкам.</p>`; }
  const пред=(v,pv)=>P&&pv!=null?` <span class="small">${дельтаHtml(pv,v)} к пред. месяцу</span>`:"";
  const успPct=M.продающих?Math.round(1000*M.успешных/M.продающих)/10:null;
  const успP=P&&P.продающих?Math.round(1000*P.успешных/P.продающих)/10:null;
  const сред=M.средний!=null?M.средний:avg(M.поДням.map(x=>x.средний));
  const средP=P?(P.средний!=null?P.средний:avg(P.поДням.map(x=>x.средний))):null;
  h+='<div class="grid kpis">';
  [["Дней с оценкой",рабочих,M.дни[0].slice(8)+"–"+M.дни[M.дни.length-1].slice(8)+" "+МЕС[+ym.slice(5,7)-1].toLowerCase()],
   ["Чатов за месяц",M.есть_строки?M.чатов:M.поДням.reduce((a,x)=>a+x.чатов,0),"все типы"],
   ["Средний балл отдела",сред==null?"—":сред,"по продающим"+пред(сред,средP)],
   ["Успешных ≥7",успPct==null?"—":успPct+"%",M.продающих?M.успешных+" из "+M.продающих:""+пред(успPct,успP)]
  ].forEach(c=>h+=`<div class="card bar kpi"><div class="label">${c[0]}</div><div class="val" style="color:${typeof c[1]==="number"&&c[0].startsWith("Средний")?colorFor(c[1]):"#fff"}">${esc(c[1])}</div><div class="note">${c[2]}</div></div>`);
  h+='</div>';
  h+=`<div class="grid two-cards" style="margin-top:16px">
    <div class="card"><div class="label muted small">ЛУЧШИЙ ДЕНЬ</div><div style="font-family:var(--head);font-size:28px;color:var(--green);margin-top:6px">${M.лучший?M.лучший.дата+" · "+M.лучший.средний:"—"}</div></div>
    <div class="card"><div class="label muted small">ХУДШИЙ ДЕНЬ</div><div style="font-family:var(--head);font-size:28px;color:var(--red);margin-top:6px">${M.худший?M.худший.дата+" · "+M.худший.средний:"—"}</div></div></div>`;
  h+='<div class="card" style="margin-top:16px"><div class="label muted small">СРЕДНИЙ БАЛЛ ОТДЕЛА ПО ДНЯМ</div><div style="margin-top:8px"><canvas id="mline"></canvas></div></div>';
  if(M.рейтинг.length){
    h+='<h2 style="font-size:16px;margin-top:22px">Рейтинг за месяц</h2><div class="card"><div class="scroll"><table><thead><tr><th>#</th><th>Менеджер</th><th>Средний итог</th><th>Чатов</th><th>Дней</th><th>К пред. месяцу</th></tr></thead><tbody>';
    M.рейтинг.forEach(([n,b,ч,дн],i)=>{ const pv=P&&P.рейтинг.find(x=>x[0]===n); 
      h+=`<tr><td class="rank">${i+1}</td><td><b>${esc(n)}</b></td><td><span class="pill" style="background:${colorFor(b)}">${b}</span></td><td class="muted">${ч}</td><td class="muted">${дн}</td><td>${pv?дельтаHtml(pv[1],b):'<span class="muted">—</span>'}</td></tr>`; });
    h+='</tbody></table></div></div>';
  }
  if(M.есть_строки){
    const крит=(заг,o,po)=>{ const keys=Object.keys(o); if(!keys.length) return "";
      let t=`<h2 style="font-size:16px;margin-top:22px">${заг}</h2><div class="card"><div class="scroll"><table><thead><tr><th>Критерий</th><th>Месяц</th><th>К пред. месяцу</th></tr></thead><tbody>`;
      keys.sort((a,b)=>o[a]-o[b]).forEach(k=>{ t+=`<tr><td>${esc(nm(k))}</td><td><span class="pill" style="background:${colorFor(o[k])}">${o[k]}</span></td><td>${po&&po[k]!=null?дельтаHtml(po[k],o[k]):'<span class="muted">—</span>'}</td></tr>`; });
      return t+'</tbody></table></div></div>'; };
    h+=крит('Критерии отдела · входящие (слабые сверху)',M.вход,P&&P.вход);
    h+=крит('Критерии отдела · исходящие (слабые сверху)',M.исх,P&&P.исх);
    h+='<h2 style="font-size:16px;margin-top:22px">По типам чатов</h2><div class="grid typegrid">';
    ["новый","продление","сервис","исходящий","партнёрство"].forEach(t=>{ const a=M.типы[t]||[]; const v=avg(a);
      h+=`<div class="card type"><div class="n">${a.length}</div><div class="t">${t}</div><div style="margin-top:8px">ср. итог <b style="color:${colorFor(v)}">${v==null?"—":v}</b></div></div>`; });
    h+='</div>';
  }
  h+='<h2 style="font-size:16px;margin-top:22px">По дням</h2><div class="card"><div class="scroll"><table><thead><tr><th>Дата</th><th>Средний балл</th><th>Чатов</th><th>Лучший менеджер</th></tr></thead><tbody>';
  M.поДням.forEach(x=>{ const л=ИСТОРИЯ[x.дата].сводка.отдел.лучший_менеджер||["—",""];
    h+=`<tr class="click" onclick="выбратьДень('${x.дата}');document.querySelector('nav button').click()"><td><b>${x.дата}</b></td><td><span class="pill" style="background:${colorFor(x.средний)}">${x.средний==null?"—":x.средний}</span></td><td class="muted">${x.чатов}</td><td class="muted">${esc(л[0])} ${л[1]}</td></tr>`; });
  h+='</tbody></table></div></div><p class="hint" style="margin-top:10px">Клик по дню — открыть его обзор.</p>';

  const box=document.getElementById("mline"); box.outerHTML=svgЛиния(M.поДням, Math.max(320,(box.parentElement.clientWidth||1000)-4));

/* График по дням — inline SVG, без внешних библиотек: работает и без интернета. */
function svgЛиния(дни,W){
  const H=220,L=36,R=16,T=14,B=30, pts=дни.filter(x=>x.средний!=null);
  const n=pts.length; const x=i=>n>1?L+(W-L-R)*i/(n-1):(L+W-R)/2; const y=v=>T+(H-T-B)*(1-v/10);
  let g='';
  [0,2,4,6,8,10].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${L-8}" y="${y(v)+4}" fill="#9A9AA5" font-size="11" text-anchor="end">${v}</text>`; });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(7)}" y2="${y(7)}" stroke="#5FCF8E" stroke-dasharray="4 4" opacity=".5"/><line x1="${L}" x2="${W-R}" y1="${y(5)}" y2="${y(5)}" stroke="#E3B341" stroke-dasharray="4 4" opacity=".5"/>`;
  if(n){ const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.средний).toFixed(1)).join(' ');
    g+=`<path d="${path} L${x(n-1).toFixed(1)} ${y(0)} L${x(0).toFixed(1)} ${y(0)} Z" fill="rgba(227,30,36,.18)"/><path d="${path}" fill="none" stroke="#E31E24" stroke-width="2.5"/>`;
    pts.forEach((p,i)=>{ const c=p.средний>=7?'#5FCF8E':p.средний>=5?'#E3B341':'#E06A6A';
      g+=`<circle cx="${x(i)}" cy="${y(p.средний)}" r="5" fill="${c}" stroke="#000" stroke-width="1.5"><title>${p.дата} · ${p.средний} · чатов ${p.чатов}</title></circle>`;
      g+=`<text x="${x(i)}" y="${y(p.средний)-10}" fill="#fff" font-size="11" text-anchor="middle">${p.средний}</text>`;
      g+=`<text x="${x(i)}" y="${H-8}" fill="#9A9AA5" font-size="11" text-anchor="middle">${p.дата.slice(8)}.${p.дата.slice(5,7)}</text>`; }); }
  else g+=`<text x="${W/2}" y="${H/2}" fill="#9A9AA5" font-size="13" text-anchor="middle">нет данных</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="220" style="display:block;font-family:var(--body)">${g}</svg>`;
}
function bindM(){ const el=document.getElementById("selM"); if(el) el.addEventListener("change",()=>{ МЕС_ВЫБРАН=el.value; renderМесяц(); }); }

/* ===== Календарь + теплокарта ===== */
const МЕС=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const ДНИ=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
let ИНДЕКС={}, калГод, калМес, калОткрыт=false;
function ymd(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function открытьКалендарь(){ калОткрыт=!калОткрыт;
  document.getElementById("calpanel").style.display=калОткрыт?"block":"none"; if(калОткрыт) renderКалендарь(); }
function смкМес(д){ калМес+=д; if(калМес<0){калМес=11;калГод--;} if(калМес>11){калМес=0;калГод++;} renderКалендарь(); }

/* ===== Верхний календарь — ТОЛЬКО просмотр одного дня ===== */
function renderКалендарь(){
  const p=document.getElementById("calpanel");
  const старт=(new Date(калГод,калМес,1).getDay()+6)%7;       // Пн=0
  const дней=new Date(калГод,калМес+1,0).getDate();
  let h=`<div class="calhead"><button data-mv="-1">‹</button><span>${МЕС[калМес]} ${калГод}</span><button data-mv="1">›</button></div><div class="calgrid">`;
  ДНИ.forEach(d=>h+=`<div class="caldow">${d}</div>`);
  for(let i=0;i<старт;i++) h+='<div class="calday empty"></div>';
  for(let d=1;d<=дней;d++){ const ds=ymd(калГод,калМес,d); const v=ИНДЕКС[ds];
    let cls="calday", style="", attr="";
    if(v==null){ cls+=" nodata"; }
    else { cls+=" has"; const c=v>=7?"var(--green)":(v>=5?"var(--amber)":"var(--red)"); style=`background:${c}`; attr=`data-d="${ds}"`; }
    if(ds===СОСТ.дата) cls+=" sel";
    h+=`<div class="${cls}" style="${style}" ${attr} title="${ds}${v!=null?' · '+v:' · нет данных'}">${d}</div>`; }
  h+='</div><div class="callegend"><span><i style="background:var(--green)"></i>≥7</span><span><i style="background:var(--amber)"></i>5–7</span><span><i style="background:var(--red)"></i>&lt;5</span><span><i style="background:#2a2730"></i>нет данных</span></div>';
  p.innerHTML=h;
}
function выбратьДень(дата){ const d=ИСТОРИЯ[дата]; if(!d) return;
  СОСТ={сводка:d.сводка, чаты:d.чаты, тексты:d.тексты, дата:дата}; renderAll(); открытьКалендарь(); }

/* ===== Сравнение двух дат — нативные <select> во вкладке «Сравнение» ===== */
function дельтаHtml(a,b){
  if(a==null||b==null) return '<span class="muted">—</span>';
  const d=Math.round((b-a)*10)/10;
  if(d>0) return `<span class="up">↑ +${d.toFixed(1)}</span>`;
  if(d<0) return `<span class="down">↓ −${Math.abs(d).toFixed(1)}</span>`;
  return '<span class="muted">→ 0.0</span>';
}
function построитьСравнениеТаб(){
  const tab=document.getElementById("tab-сравнение");
  const даты=Object.keys(ИНДЕКС).sort();
  if(даты.length<2){
    tab.innerHTML='<h2>Сравнение двух дат</h2><p class="hint">Нужно минимум два дня в архиве (сейчас: '+даты.length+').</p>';
    return;
  }
  const opt=(sel)=>даты.map(d=>`<option value="${d}"${d===sel?' selected':''}>${d} · ${ИНДЕКС[d]}</option>`).join("");
  const A=даты[daты_пред(даты)], B=даты[даты.length-1];   // по умолчанию: предыдущий день и последний
  function daты_пред(d){ return Math.max(0,d.length-2); }
  tab.innerHTML=`<h2>Сравнение двух дат</h2>
    <div class="cmpselect">
      <label>Дата A<select id="selA">${opt(A)}</select></label>
      <label>Дата B<select id="selB">${opt(B)}</select></label>
    </div>
    <div id="cmpresult"></div>`;
  document.getElementById("selA").addEventListener("change", приСменеДат);
  document.getElementById("selB").addEventListener("change", приСменеДат);
  приСменеДат();   // показать сравнение для дефолтных A и B сразу
}
function приСменеДат(){
  const A=document.getElementById("selA").value, B=document.getElementById("selB").value;
  if(A && B) сравнить(A,B);
}
function сравнить(A,B){ renderСравнение(A,ИСТОРИЯ[A].сводка,B,ИСТОРИЯ[B].сводка); }
function renderСравнение(A,sA,B,sB){
  const oA=sA.отдел,oB=sB.отдел,mA=sA.менеджеры,mB=sB.менеджеры;
  let h=`<p class="hint">Δ — изменение от <b>${A}</b> к <b>${B}</b>. Рост — <span class="up">зелёный</span>, падение — <span class="down">красный</span>.</p>`;
  h+=`<div class="card bar" style="margin-bottom:16px"><span class="label muted small">СРЕДНИЙ БАЛЛ ОТДЕЛА</span>
      <div style="margin-top:6px;font-size:18px">${oA.средний_итог} → <b>${oB.средний_итог}</b> &nbsp; ${дельтаHtml(oA.средний_итог,oB.средний_итог)}</div></div>`;
  h+=`<div class="card"><div class="scroll"><table><thead><tr><th>Менеджер</th><th>${A}</th><th>${B}</th><th>Δ</th></tr></thead><tbody>`;
  [...new Set([...Object.keys(mA),...Object.keys(mB)])].forEach(n=>{
    const a=mA[n]&&mA[n].рейтинговый_балл, b=mB[n]&&mB[n].рейтинговый_балл;
    h+=`<tr><td><b>${n}</b></td><td class="muted">${a==null?'—':a}</td><td>${b==null?'—':b}</td><td>${дельтаHtml(a,b)}</td></tr>`; });
  h+='</tbody></table></div></div>';
  function таблКрит(заг,поле,ord){
    const da=oA[поле]||{}, db=oB[поле]||{};
    const keys=ord.filter(k=>k in da||k in db);
    let t=`<h2 style="font-size:16px;margin-top:22px">${заг}</h2><div class="card"><div class="scroll"><table><thead><tr><th>Критерий</th><th>${A}</th><th>${B}</th><th>Δ</th></tr></thead><tbody>`;
    keys.forEach(k=>{ const a=da[k], b=db[k];
      t+=`<tr><td>${esc(nm(k))}</td><td class="muted">${a==null?'—':a}</td><td>${b==null?'—':b}</td><td>${дельтаHtml(a,b)}</td></tr>`; });
    return t+'</tbody></table></div></div>';
  }
  h+=таблКрит('Критерии отдела · входящие','средние_входящие',ВХОД_ОРД);
  h+=таблКрит('Критерии отдела · исходящие','средние_исходящие',ИСХ_ОРД);
  document.getElementById("cmpresult").innerHTML=h;
}
function загрузитьИндекс(){   // всё вшито — индекс строим из ИСТОРИЯ
  ИНДЕКС={}; ДАТЫ.forEach(d=>ИНДЕКС[d]=ИСТОРИЯ[d].сводка.отдел.средний_итог);
  if(калОткрыт) renderКалендарь();
  построитьСравнениеТаб();
}

/* ===== Старт: сегодня inline (мгновенно), затем подгрузка индекса ===== */
калГод=+(СЕГОДНЯ.slice(0,4))||new Date().getFullYear();
калМес=(+(СЕГОДНЯ.slice(5,7))||1)-1;

/* Делегирование на постоянной панели календаря: только просмотр дня и переключение месяца. */
document.getElementById("calpanel").addEventListener("click", function(e){
  const день=e.target.closest("[data-d]"); if(день){ выбратьДень(день.getAttribute("data-d")); return; }
  const мес=e.target.closest("[data-mv]");  if(мес){ e.preventDefault(); смкМес(+мес.getAttribute("data-mv")); return; }
});

renderAll();
загрузитьИндекс();
</script>
</body>
</html>
